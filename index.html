<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunshine – Earn from Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-md border-b border-gray-200/50 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <span class="text-2xl font-bold text-[#1E3A8A]">Sunshine</span>
      <div>
        <a href="#login" class="text-slate-600 hover:text-[#1E3A8A] mr-6">Login</a>
        <a href="#signup" class="btn-primary text-white px-6 py-2 rounded-full text-sm font-medium">Sign Up</a>
      </div>
    </div>
  </nav>
  <section class="pt-32 pb-20 px-6 max-w-7xl mx-auto text-center">
    <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-[#1E3A8A] leading-tight">
      Earn ₹5,500 <span class="text-[#0D9488]">From Home</span>
    </h1>
    <p class="text-slate-600 text-lg mt-4 max-w-2xl mx-auto">
      Solve captchas daily, track your 21‑day progress, and withdraw via UPI or USDT.
    </p>
    <div class="mt-8 flex flex-wrap justify-center gap-4">
      <a href="#signup" class="btn-primary text-white px-8 py-3 rounded-full text-lg shadow-lg">Get Started</a>
    </div>
  </section>
  <section id="signup" class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 mb-12">
    <h2 class="text-2xl font-bold text-[#1E3A8A] mb-6">Create Account</h2>
    <form id="signupForm">
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700">Username</label>
        <input type="text" id="signupUsername" class="w-full border border-slate-300 rounded-lg px-4 py-2" required>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700">Password</label>
        <input type="password" id="signupPassword" class="w-full border border-slate-300 rounded-lg px-4 py-2" required>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700">UPI ID</label>
        <input type="text" id="signupUpi" class="w-full border border-slate-300 rounded-lg px-4 py-2" required>
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-700">USDT Address</label>
        <input type="text" id="signupUsdt" class="w-full border border-slate-300 rounded-lg px-4 py-2" required>
      </div>
      <button type="submit" class="w-full btn-primary text-white py-3 rounded-lg text-lg font-medium">Sign Up</button>
    </form>
    <p class="mt-4 text-center text-sm text-slate-500">Already have an account? <a href="#login" class="text-[#0D9488] font-medium">Login</a></p>
  </section>
  <script src="app.js"></script>
</body>
</html>
