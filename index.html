<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunshine – Earn from Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-md border-b border-gray-200/50 z-50">
    <div class="container flex justify-between items-center py-4">
      <span class="text-2xl font-bold text-[#1E3A8A]">Sunshine</span>
      <button id="toggleAuthBtn" class="text-sm text-[#0D9488] font-medium hover:underline">
        Login
      </button>
    </div>
  </nav>

  <!-- Hero -->
  <section class="pt-32 pb-12 text-center">
    <div class="container">
      <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-[#1E3A8A] leading-tight">
        Earn ₹5,500 <span class="text-[#0D9488]">From Home</span>
      </h1>
      <p class="text-slate-600 text-lg max-w-2xl mx-auto mt-4">
        Solve captchas daily, track your 21‑day progress, and withdraw via UPI or USDT.
      </p>
    </div>
  </section>

  <!-- Signup Form -->
  <section id="signupSection" class="container max-w-md mx-auto mb-12">
    <div class="card">
      <h2 class="text-2xl font-bold text-[#1E3A8A] mb-6">Create Account</h2>
      <form id="signupForm">
        <div class="mb-4">
          <label class="label">Username *</label>
          <input type="text" id="signupUsername" class="input-field" required>
        </div>
        <div class="mb-4">
          <label class="label">Password *</label>
          <input type="password" id="signupPassword" class="input-field" required>
        </div>
        <div class="mb-4">
          <label class="label">UPI ID *</label>
          <input type="text" id="signupUpi" class="input-field" required>
        </div>
        <div class="mb-4">
          <label class="label">Email *</label>
          <input type="email" id="signupEmail" class="input-field" required>
        </div>
        <div class="mb-6">
          <label class="label">USDT Address (optional)</label>
          <input type="text" id="signupUsdt" class="input-field">
        </div>
        <button type="submit" class="btn-primary w-full">Sign Up</button>
      </form>
      <p class="text-center text-sm text-slate-500 mt-4">
        Already have an account? <span id="switchToLogin" class="text-[#0D9488] font-medium cursor-pointer">Login</span>
      </p>
    </div>
  </section>

  <!-- Login Form (hidden by default) -->
  <section id="loginSection" class="container max-w-md mx-auto mb-12 hidden">
    <div class="card">
      <h2 class="text-2xl font-bold text-[#1E3A8A] mb-6">Login</h2>
      <form id="loginForm">
        <div class="mb-4">
          <label class="label">Username</label>
          <input type="text" id="loginUsername" class="input-field" required>
        </div>
        <div class="mb-6">
          <label class="label">Password</label>
          <input type="password" id="loginPassword" class="input-field" required>
        </div>
        <button type="submit" class="btn-primary w-full">Login</button>
      </form>
      <p class="text-center text-sm text-slate-500 mt-4">
        Don't have an account? <span id="switchToSignup" class="text-[#0D9488] font-medium cursor-pointer">Sign Up</span>
      </p>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
